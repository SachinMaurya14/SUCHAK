name: SUCHAK Enterprise CI & Security Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Build, Lint & Security Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Lint Codebase
        run: npm run lint

      - name: Compile Production Artifacts
        run: npm run build

      - name: Verify Multi-Stage Dockerfile Syntax
        run: |
          docker build -t suchak-hse:test --target builder .
